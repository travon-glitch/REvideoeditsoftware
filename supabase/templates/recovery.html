<!-- Supabase → Authentication → Emails → "Reset password". Subject: Choose a new password -->
<h2>Choose a new password</h2>
<p>Someone asked to reset the password for this account. If it was you, press the button.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/account/password"
      style="display:inline-block;padding:12px 20px;background:#1D4ED8;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:600">Choose a new password</a></p>
<p style="color:#4B5563;font-size:14px">If you didn't ask for this, you can ignore this email — your password stays the same.</p>
