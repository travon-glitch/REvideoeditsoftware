# Supabase local development config (`supabase start`).
# For the hosted project, mirror the [auth] settings in the dashboard:
#   Authentication → Sign In / Providers → turn OFF "Allow new users to sign up".
project_id = "listing-video-studio"

[api]
enabled = true
port = 54321
schemas = ["public"]          # the private schema is never exposed over the API
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[storage]
enabled = true
file_size_limit = "2GiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Internal company tool: nobody can create their own account.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
# This switch is the EMAIL PROVIDER itself: false would block email LOGIN too ("Email logins are
# disabled"). Sign-ups are turned off by `[auth] enable_signup = false` above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_expiry = 3600

[auth.email.template.invite]
subject = "You're invited to the company video studio"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Choose a new password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email-change.html"

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = false

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_verifications = 30
